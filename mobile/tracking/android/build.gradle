apply plugin: 'com.android.library'
android {
    namespace 'ro.autocare.tracking'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig { minSdkVersion rootProject.ext.minSdkVersion; targetSdkVersion rootProject.ext.targetSdkVersion }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.activity:activity:${rootProject.ext.androidxActivityVersion}"
}
