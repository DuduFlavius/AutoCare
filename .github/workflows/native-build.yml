name: Native GPS builds
on:
  push:
    branches: [feature/autocare-native-gps-20261104, feature/autocare-ai-integrated, audit/rca-gps-play-20261117, release/smartdrive-61, release/play-readiness, release/signature-forms]
    # The controlled release branches run this packaging gate without publishing.
    paths: ["mobile/**", ".github/workflows/native-build.yml"]
  pull_request:
    branches: [feature/autocare-ai-integrated, feature/autocare-desktop-premium-20261102, feature/autocare-native-gps-20261104]
    paths: ["mobile/**", ".github/workflows/native-build.yml"]
  workflow_dispatch:
    inputs:
      distribution:
        description: Android distribution (direct uses Stripe, play uses Google Play Billing)
        type: choice
        options: [direct, play]
        default: direct
      signed_android_release:
        description: 'Build a signed Google Play AAB using configured upload-key secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ${{ github.ref == 'refs/heads/release/smartdrive-61' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Java compiler
        run: |
          "$JAVA_HOME_21_X64/bin/java" -version
          "$JAVA_HOME_21_X64/bin/javac" -version
      - run: npm ci --prefix mobile
      - run: cd mobile && npx cap sync android
      - name: Compile Android debug app
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd mobile/android
          ./gradlew :app:assembleDebug :app:lintRelease :app:testDebugUnitTest :autocare-native-tracking:testDebugUnitTest
      - name: Verify production Firebase release compilation
        run: |
          cp mobile/firebase/google-services.production.json mobile/android/app/google-services.json
          node scripts/verify-android-firebase.mjs
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd mobile/android
          ./gradlew :app:assembleRelease :app:lintRelease
      - name: Archive production APK for protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-production-unsigned-APK
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      - name: Verify Play distribution package and permissions
        working-directory: mobile/android
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew -PautocareDistribution=play :app:assembleRelease :app:bundleRelease
          mkdir -p "$RUNNER_TEMP/autocare-play"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/autocare-play/badging.txt"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/autocare-play/permissions.txt"
          grep -F "package: name='ro.autocare.garage'" "$RUNNER_TEMP/autocare-play/badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/autocare-play/badging.txt"
          grep -F "com.android.vending.BILLING" "$RUNNER_TEMP/autocare-play/permissions.txt"
          if grep -Fq "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/autocare-play/permissions.txt"; then
            echo "Play package declares external package installation"
            exit 1
          fi
          unzip -tq app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          python3 ../../scripts/check-android-page-size.py "$apk"
          python3 ../../scripts/check-android-page-size.py app/build/outputs/bundle/release/app-release.aab
      - name: Archive Play package verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Play-package-verification
          path: ${{ runner.temp }}/autocare-play/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Archive unsigned Play-format bundle for verification only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Android-unsigned-AAB-not-for-upload
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Archive Android quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Android-quality-reports
          path: mobile/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 7
  android-release:
    permissions:
      contents: write
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/autocare-ai-integrated') || (github.event_name == 'workflow_dispatch' && inputs.signed_android_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix mobile
      - run: cd mobile && npx cap sync android
      - name: Configure Android Firebase
        env:
          AUTOCARE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AUTOCARE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$AUTOCARE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$AUTOCARE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json
          else
            cp mobile/firebase/google-services.production.json mobile/android/app/google-services.json
          fi
          node scripts/verify-android-firebase.mjs
      - name: Build signed Google Play AAB
        env:
          AUTOCARE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AUTOCARE_UPLOAD_KEYSTORE_BASE64 }}
          AUTOCARE_UPLOAD_STORE_PASSWORD: ${{ secrets.AUTOCARE_UPLOAD_STORE_PASSWORD }}
          AUTOCARE_UPLOAD_KEY_ALIAS: ${{ secrets.AUTOCARE_UPLOAD_KEY_ALIAS }}
          AUTOCARE_UPLOAD_KEY_PASSWORD: ${{ secrets.AUTOCARE_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in AUTOCARE_UPLOAD_KEYSTORE_BASE64 AUTOCARE_UPLOAD_STORE_PASSWORD AUTOCARE_UPLOAD_KEY_ALIAS AUTOCARE_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then echo "Missing required Android upload signing configuration: $key"; exit 1; fi
          done
          export AUTOCARE_UPLOAD_KEYSTORE="$RUNNER_TEMP/autocare-upload.jks"
          trap 'rm -f "$AUTOCARE_UPLOAD_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$AUTOCARE_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$AUTOCARE_UPLOAD_KEYSTORE"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd mobile/android
          ./gradlew -PautocareDistribution=${{ inputs.distribution || 'direct' }} :app:bundleRelease :app:assembleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Google-Play-signed-AAB
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Archive signed Play APK for device tests
        if: inputs.distribution == 'play'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Play-signed-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish signed Android installer for in-app updates
        if: inputs.distribution != 'play'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import json, pathlib, re, shutil, os, subprocess
          gradle=pathlib.Path('mobile/android/app/build.gradle').read_text()
          version=re.search(r'versionName "([0-9.]+)"',gradle).group(1)
          code=int(re.search(r'versionCode (\d+)',gradle).group(1))
          folder=pathlib.Path('public/downloads');folder.mkdir(parents=True,exist_ok=True)
          name=f'AutoCare-{version}.apk'
          previous=json.loads((folder/'android-release.json').read_text())
          old_name=pathlib.PurePosixPath(previous['url']).name
          if not re.fullmatch(r'AutoCare-[0-9.]+\.apk',old_name): raise SystemExit('Invalid previous Android installer path')
          verifier=str(pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/apksigner')
          def certificate(file):
              output=subprocess.check_output([verifier,'verify','--print-certs',str(file)],text=True)
              match=re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)',output)
              if not match: raise SystemExit('Cannot verify Android signing identity')
              return match.group(1)
          built=pathlib.Path('mobile/android/app/build/outputs/apk/release/app-release.apk')
          release_certificate=certificate(built)
          if certificate(folder/old_name)!=release_certificate: raise SystemExit('Android signing key differs from the existing public installer; update publication blocked')
          associations=json.loads(pathlib.Path('public/.well-known/assetlinks.json').read_text())
          fingerprints={fingerprint.replace(':','').lower() for entry in associations
                        if 'delegate_permission/common.handle_all_urls' in entry['relation']
                        and entry['target'].get('package_name')=='ro.autocare.garage'
                        for fingerprint in entry['target']['sha256_cert_fingerprints']}
          if release_certificate not in fingerprints: raise SystemExit('Android signing key is missing from the AutoCare App Links association')
          aapt=pathlib.Path(verifier).with_name('aapt')
          badging=subprocess.check_output([str(aapt),'dump','badging',str(built)],text=True)
          min_sdk=re.search(r"^sdkVersion:'([0-9]+)'",badging,re.M)
          if not min_sdk: raise SystemExit('Cannot read minimum Android SDK from release APK')
          release={'version':version,'versionCode':code,'url':f'/downloads/{name}','minSdk':int(min_sdk.group(1))}
          history=previous.get('previous',[])
          if previous['version']==version:
              release.update({key:previous[key] for key in ('publishedAt','changes') if key in previous})
          else:
              history=[{key:previous[key] for key in ('version','publishedAt','changes') if key in previous},*history]
          release.setdefault('publishedAt',datetime.now(timezone.utc).isoformat(timespec='seconds'))
          release['previous']=history
          shutil.copyfile(built,folder/name)
          (folder/'android-release.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads
          git diff --cached --quiet && exit 0
          git commit -m "Publish signed Android installer for in-app updates"
          git push origin HEAD:${{ github.ref_name }}
  ios:
    if: github.ref != 'refs/heads/release/smartdrive-61' && github.ref != 'refs/heads/release/play-readiness' && github.ref != 'refs/heads/release/signature-forms'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix mobile
      - run: cd mobile && npx cap sync ios
      - name: Compile iOS simulator app without signing
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/autocare-ios CODE_SIGNING_ALLOWED=NO build
