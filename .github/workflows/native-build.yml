name: Native GPS builds
on:
  push:
    branches: [feature/autocare-native-gps-20261104]
    paths: ["mobile/**", ".github/workflows/native-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix mobile
      - run: cd mobile && npx cap sync android
      - name: Compile Android debug app
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd mobile/android
          ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoCare-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix mobile
      - run: cd mobile && npx cap sync ios
      - name: Compile iOS simulator app without signing
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/autocare-ios CODE_SIGNING_ALLOWED=NO build
